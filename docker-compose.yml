services:
  demo-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: demo-app
    ports:
      - "8001:8000"
    environment:
      OTEL_SERVICE_NAME: demo-app
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=1.0.0
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: metrics,health
    labels:
      logging: "enabled"
      service: "demo-app"
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: inventory/Dockerfile
    container_name: inventory-service
    ports:
      - "8002:8000"
    environment:
      OTEL_SERVICE_NAME: inventory-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.version=1.0.0
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: metrics,health
    labels:
      logging: "enabled"
      service: "inventory-service"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.3
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prom_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    restart: unless-stopped
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager

  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    ports:
      - "3100:3100"
    restart: unless-stopped
    volumes:
      - ./infra/loki:/etc/loki:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.7.3
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    container_name: jaeger
    ports:
      - "16686:16686"
    expose:
      - "4317"
      - "4318"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.154.0
    container_name: otel-collector
    command:
      - "--config=/etc/otelcol/config.yaml"
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    depends_on:
      - jaeger
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  grafana:
    image: grafana/grafana-enterprise:12.2.9
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

volumes:
  prom_data:
  alertmanager_data:
  loki_data:
  grafana_data:
