[project]
name = "observability-to-aiops-lab"
version = "0.1.0"
description = "Hands-on observability engineering and AIOps lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "opentelemetry-distro==0.59b0",
    "opentelemetry-exporter-otlp==1.38.0",
    "opentelemetry-instrumentation-asgi==0.59b0",
    "opentelemetry-instrumentation-fastapi==0.59b0",
    "opentelemetry-instrumentation-httpx==0.59b0",
    "prometheus-client==0.21.1",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]
aiops = [
    "cmdstanpy==1.2.0",
    "matplotlib==3.8.2",
    "numpy==1.26.2",
    "pandas==2.1.3",
    "plotly==5.18.0",
    "prometheus-api-client==0.5.3",
    "prophet==1.1.5",
    "scikit-learn==1.3.2",
]

[tool.ruff]
extend-exclude = [
    "aiops",
    "notebooks",
]
